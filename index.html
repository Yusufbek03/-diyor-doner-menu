<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diyor Döner — Menyu</title>
  <meta name="description" content="Diyor Döner — Toshkentdagi eng mazali doner va pizza menyu.">
  <meta property="og:title" content="Diyor Döner — Menyu">
  <meta property="og:description" content="Toshkentdagi eng mazali doner va pizza menyu.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#b8860b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥙</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Diyor <span>Döner</span></div>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Mavzuni o'zgartirish">
        <span class="theme-icon" id="theme-icon">☀️</span>
      </button>
      <button class="cart-btn" onclick="openCart()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Savat
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </div>
</header>

<div class="cat-nav-wrap">
  <div class="cat-nav" id="cat-nav"></div>
</div>

<div class="hero">
  <h1 class="hero-title">Menyu</h1>
  <p class="hero-sub">Taomlarni tanlang va savatga qo'shing</p>
</div>

<div class="search-sort-wrap">
  <div class="search-box">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-input" class="search-input" placeholder="Taom qidirish..." oninput="onSearch()">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">&times;</button>
  </div>

</div>

<main id="menu-main"></main>

<!-- Savat paneli -->
<div class="drawer-overlay" id="overlay" onclick="closeCart()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">Savat</span>
    <button class="drawer-close" onclick="closeCart()">&times;</button>
  </div>
  <div class="drawer-body" id="cart-body"></div>
  <div class="drawer-footer">
    <div class="total-row">
      <span class="total-label">Jami</span>
      <span class="total-amount" id="cart-total">0 so'm</span>
    </div>
    <button class="order-btn" id="order-btn" onclick="openOrderModal()">Buyurtma berish →</button>
  </div>
</div>

<!-- Buyurtma tasdiqlash modali -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-icon">📋</div>
    <div class="modal-title">Buyurtmani tasdiqlash</div>
    <div class="modal-text">Buyurtmani tekshiring va tasdiqlang</div>
    <div class="modal-items" id="modal-items-list"></div>
    <div class="table-select">
      <label for="table-number">Stol raqami</label>
      <select id="table-number">
        <option value="">Tanlang...</option>
        <option value="1">Stol 1</option>
        <option value="2">Stol 2</option>
        <option value="3">Stol 3</option>
        <option value="4">Stol 4</option>
        <option value="5">Stol 5</option>
        <option value="6">Stol 6</option>
        <option value="7">Stol 7</option>
        <option value="8">Stol 8</option>
        <option value="9">Stol 9</option>
        <option value="10">Stol 10</option>
        <option value="takeaway">Olib ketish</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeOrderModal()">Orqaga</button>
      <button class="modal-confirm" onclick="confirmOrder()">Buyurtma berish ✓</button>
    </div>
  </div>
</div>

<!-- Muvaffaqiyat ekrani -->
<div class="success-screen" id="success-screen">
  <div class="success-emoji">🎉</div>
  <div class="success-title">Buyurtma qabul qilindi!</div>
  <div class="success-sub">Rahmat! Buyurtmangiz oshxonaga yuborildi. Kuting — tezda tayyor bo'ladi!</div>
  <button class="success-back" onclick="resetAll()">Menyuga qaytish</button>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
